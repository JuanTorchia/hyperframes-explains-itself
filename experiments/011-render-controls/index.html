<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Experiment 011 - Render Controls</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #121417;
        color: #f7f1e8;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 70% 26%, rgba(155, 240, 202, 0.24), transparent 24%),
          linear-gradient(90deg, rgba(247, 241, 232, 0.05) 1px, transparent 1px),
          linear-gradient(0deg, rgba(247, 241, 232, 0.05) 1px, transparent 1px),
          #121417;
        background-size: auto, 96px 96px, 96px 96px, auto;
      }

      section {
        width: 1160px;
        border: 1px solid rgba(247, 241, 232, 0.22);
        border-radius: 8px;
        background: rgba(10, 12, 14, 0.76);
        padding: 60px;
      }

      p,
      h1 {
        margin: 0;
      }

      p {
        color: #9bf0ca;
        font-size: 34px;
        font-weight: 760;
      }

      h1 {
        margin-top: 18px;
        font-size: 86px;
        line-height: 1.02;
      }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="render-controls" data-start="0" data-width="1920" data-height="1080" data-duration="1" data-fps="30">
      <section>
        <p>Render controls</p>
        <h1>Same source, different encoder settings.</h1>
      </section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["render-controls"] = { duration: () => 1, pause: () => undefined, seek: () => undefined };
    </script>
  </body>
</html>
