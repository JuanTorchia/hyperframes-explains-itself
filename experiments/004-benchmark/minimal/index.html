<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 004 - Minimal Benchmark</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #11181d;
        color: #f4f0e8;
      }

      .card {
        width: 860px;
        padding: 44px;
        border: 1px solid rgba(244, 240, 232, 0.22);
        background: #172027;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 60px;
      }

      p {
        margin: 0;
        color: #cfd6d2;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="benchmark-minimal" data-start="0" data-duration="3" data-width="1920" data-height="1080" data-fps="30">
      <section class="card clip" data-start="0" data-duration="3" data-track-index="0">
        <h1>Benchmark target</h1>
        <p>Small composition, stable text, no external media.</p>
      </section>
    </main>
  </body>
</html>
