<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 001 - Media Timing</title>
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f4f0e8;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101418;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05) brightness(0.62);
      }

      .proof-frame {
        position: absolute;
        inset: 48px;
        border: 2px solid rgba(244, 240, 232, 0.35);
      }

      .panel {
        position: absolute;
        left: 72px;
        bottom: 72px;
        width: 780px;
        padding: 34px;
        background: rgba(16, 20, 24, 0.86);
        border: 1px solid rgba(244, 240, 232, 0.2);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 54px;
        line-height: 1.02;
        font-weight: 760;
      }

      p {
        margin: 0;
        color: #d9d3c8;
        font-size: 25px;
        line-height: 1.35;
      }

      .chips {
        display: flex;
        gap: 12px;
        margin-top: 26px;
      }

      .chip {
        padding: 10px 14px;
        border: 1px solid rgba(244, 240, 232, 0.25);
        color: #c9f2dd;
        font-size: 19px;
        font-family: Arial, Helvetica, sans-serif;
      }

      .snapshot {
        position: absolute;
        right: 72px;
        top: 72px;
        width: 420px;
        border: 1px solid rgba(244, 240, 232, 0.25);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }
    </style>
  </head>
  <body>
    <main
      id="root"
      class="stage"
      data-composition-id="media-timing"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <video
        id="trimmed-source-video"
        class="clip"
        src="assets/source-tutorial-keyframed.mp4"
        data-start="0"
        data-duration="6"
        data-media-start="32"
        data-track-index="0"
        data-volume="0.18"
        data-has-audio="true"
      ></video>

      <img
        id="contact-sheet-layer"
        class="snapshot clip"
        src="assets/source-contact-sheet.jpg"
        alt="Contact sheet from the main render"
        data-start="1"
        data-duration="4"
        data-track-index="1"
      />

      <div id="safe-frame-overlay" class="proof-frame clip" data-start="0" data-duration="6" data-track-index="2"></div>

      <section id="media-proof-panel" class="panel clip" data-start="0.4" data-duration="5.2" data-track-index="3">
        <h1>Real media on the timeline.</h1>
        <p>
          The source MP4 starts at 32 seconds, plays for 6 seconds, keeps low-volume audio, and receives HTML overlays.
        </p>
        <div class="chips">
          <span class="chip">data-media-start="32"</span>
          <span class="chip">data-volume="0.18"</span>
          <span class="chip">track-index</span>
        </div>
      </section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      tl.from("#media-proof-panel", { opacity: 0, y: 28, duration: 0.45 }, 0.4);
      tl.from("#contact-sheet-layer", { opacity: 0, x: 34, duration: 0.4 }, 1);
      tl.to({}, { duration: 6 }, 0);

      window.__timelines["media-timing"] = tl;
    </script>
  </body>
</html>
