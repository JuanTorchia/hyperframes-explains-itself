<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Experiment 009 - Track Attributes</title>
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101214;
        color: #f7f1e8;
        font-family: Arial, Helvetica, sans-serif;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(247, 241, 232, 0.05) 1px, transparent 1px),
          linear-gradient(0deg, rgba(247, 241, 232, 0.05) 1px, transparent 1px),
          #101214;
        background-size: 120px 120px;
      }

      .title {
        position: absolute;
        top: 68px;
        left: 72px;
        margin: 0;
        font-size: 56px;
        line-height: 1.05;
      }

      .track-grid {
        position: absolute;
        inset: 198px 72px 108px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
      }

      .panel {
        display: grid;
        align-content: center;
        min-width: 0;
        border: 1px solid rgba(247, 241, 232, 0.22);
        border-radius: 8px;
        background: rgba(247, 241, 232, 0.07);
        padding: 34px;
      }

      .panel strong {
        color: #9bf0ca;
        font-size: 34px;
      }

      .panel span {
        display: block;
        margin-top: 18px;
        color: #d7d0c5;
        font-family: monospace;
        font-size: 28px;
        line-height: 1.24;
      }

      .loop-chip {
        position: absolute;
        right: 88px;
        bottom: 58px;
        width: 180px;
        height: 68px;
        border: 1px solid rgba(155, 240, 202, 0.58);
        border-radius: 8px;
        background: rgba(155, 240, 202, 0.14);
        color: #9bf0ca;
        font-family: monospace;
        font-size: 24px;
        line-height: 68px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main
      id="root"
      class="stage"
      data-composition-id="track-attributes"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-bg="#101214"
    >
      <audio
        id="muted-speed-audio"
        src="assets/attribute-tone.wav"
        data-start="0"
        data-duration="6"
        data-track="muted fast audio"
        data-volume="0.4"
        data-speed="1.25"
        data-mute
      ></audio>

      <h1 class="title">Track and media attributes in isolation.</h1>

      <section id="fade-panel" class="panel clip" data-start="0.4" data-duration="2.4" data-fade="both" data-track="fade">
        <strong>Fade window</strong>
        <span>data-start="0.4"<br />data-duration="2.4"<br />data-fade="both"</span>
      </section>

      <section id="end-panel" class="panel clip" data-start="2.2" data-duration="3.2" data-track="duration replacement">
        <strong>End instead of duration</strong>
        <span>data-start="2.2"<br />data-duration="3.2"<br />data-track="end replacement"</span>
      </section>

      <section id="media-panel" class="panel clip" data-start="3.1" data-duration="2.5" data-track="media controls">
        <strong>Media controls</strong>
        <span>data-volume="0.4"<br />data-speed="1.25"<br />data-mute</span>
      </section>

      <div id="loop-chip" class="loop-chip clip" data-start="0" data-duration="6" data-loop data-track="looping visual">data-loop</div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      tl.from("#fade-panel", { y: 24, opacity: 0, duration: 0.25 }, 0.4);
      tl.from("#end-panel", { y: 24, opacity: 0, duration: 0.25 }, 2.2);
      tl.from("#media-panel", { y: 24, opacity: 0, duration: 0.25 }, 3.1);
      tl.to(".loop-chip", { x: -80, repeat: 5, yoyo: true, duration: 0.5, ease: "none" }, 0);
      tl.to({}, { duration: 6 }, 0);

      window.__timelines["track-attributes"] = tl;
    </script>
  </body>
</html>
