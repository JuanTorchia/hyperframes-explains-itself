<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 002 - PNG Sequence</title>
    <script src="../../../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #101418;
        color: #f4f0e8;
      }

      main {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      section {
        width: 920px;
        padding: 44px;
        border: 1px solid rgba(244, 240, 232, 0.24);
        background: #172027;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 64px;
      }

      p {
        margin: 0;
        color: #cfd6d2;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="png-sequence-proof" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-fps="30">
      <section id="proof-card" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <h1>PNG sequence</h1>
        <p>One second at 30fps should produce 30 RGBA frame files.</p>
      </section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#proof-card", { opacity: 0.75, scale: 0.98, duration: 0.2 }, 0);
      tl.to({}, { duration: 1 }, 0);
      window.__timelines["png-sequence-proof"] = tl;
    </script>
  </body>
</html>
