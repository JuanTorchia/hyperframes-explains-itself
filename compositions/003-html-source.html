<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../styles/video.css" />
  </head>
  <body>
    <div id="root" class="hf-stage scene-frame" data-composition-id="scene-source" data-width="1920" data-height="1080">
      <div class="scene">
        <p class="kicker">Why it matters</p>
        <h2>HTML is inspectable. Video output becomes generated artifact.</h2>
        <div class="code-row">
          <div class="code-card">&lt;section<br />data-start="14"<br />data-duration="10"&gt;</div>
          <div class="code-card">CSS controls<br />layout,<br />type,<br />motion.</div>
          <div class="code-card">Git can diff<br />the actual<br />video source.</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 10 }, 0);
      window.__timelines["scene-source"] = tl;
    </script>
  </body>
</html>
