<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../styles/video.css" />
  </head>
  <body>
    <div id="root" class="hf-stage scene-frame" data-composition-id="scene-close" data-width="1920" data-height="1080">
      <div class="scene">
        <h2>HTML is the source. MP4 is the artifact.</h2>
        <div class="artifact">
          <div class="artifact-box">
            <strong>Source</strong>
            <span>index.html</span>
          </div>
          <div class="arrow">-&gt;</div>
          <div class="artifact-box">
            <strong>Artifact</strong>
            <span>renders/hyperframes-in-60-seconds.mp4</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 4 }, 0);
      window.__timelines["scene-close"] = tl;
    </script>
  </body>
</html>
