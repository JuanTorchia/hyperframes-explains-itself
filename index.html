<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames in 60 Seconds</title>
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="./styles/video.css" />
  </head>
  <body>
    <div
      id="root"
      class="hf-stage"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <audio
        id="voiceover"
        src="audio/generated/hyperframes-in-60-seconds-af-nova.wav"
        data-start="0"
        data-duration="55.850667"
        data-track-index="0"
        data-volume="1"
      ></audio>

      <section id="scene-hook" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="scene">
          <p class="kicker">Experiment</p>
          <h1>Can HyperFrames explain HyperFrames?</h1>
        </div>
      </section>

      <div
        id="scene-what"
        class="clip"
        data-composition-id="scene-what"
        data-composition-src="compositions/002-what-it-is.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="scene-source"
        class="clip"
        data-composition-id="scene-source"
        data-composition-src="compositions/003-html-source.html"
        data-start="14"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="scene-setup"
        class="clip"
        data-composition-id="scene-setup"
        data-composition-src="compositions/004-setup.html"
        data-start="24"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="scene-init"
        class="clip"
        data-composition-id="scene-init"
        data-composition-src="compositions/005-init.html"
        data-start="32"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="scene-preview"
        class="clip"
        data-composition-id="scene-preview"
        data-composition-src="compositions/006-preview.html"
        data-start="40"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="scene-render"
        class="clip"
        data-composition-id="scene-render"
        data-composition-src="compositions/007-render.html"
        data-start="49"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="scene-close"
        class="clip"
        data-composition-id="scene-close"
        data-composition-src="compositions/008-close.html"
        data-start="56"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div class="caption">hyperframes-explains-itself</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const sceneIds = [
        "scene-what",
        "scene-source",
        "scene-setup",
        "scene-init",
        "scene-preview",
        "scene-render",
        "scene-close",
      ];

      const tl = gsap.timeline({ paused: true });
      for (const id of sceneIds) {
        tl.set(`#${id}`, { autoAlpha: 0 }, 0);
      }

      tl.set("#scene-hook", { autoAlpha: 0 }, 6);
      tl.set("#scene-what", { autoAlpha: 1 }, 6);
      tl.set("#scene-what", { autoAlpha: 0 }, 14);
      tl.set("#scene-source", { autoAlpha: 1 }, 14);
      tl.set("#scene-source", { autoAlpha: 0 }, 24);
      tl.set("#scene-setup", { autoAlpha: 1 }, 24);
      tl.set("#scene-setup", { autoAlpha: 0 }, 32);
      tl.set("#scene-init", { autoAlpha: 1 }, 32);
      tl.set("#scene-init", { autoAlpha: 0 }, 40);
      tl.set("#scene-preview", { autoAlpha: 1 }, 40);
      tl.set("#scene-preview", { autoAlpha: 0 }, 49);
      tl.set("#scene-render", { autoAlpha: 1 }, 49);
      tl.set("#scene-render", { autoAlpha: 0 }, 56);
      tl.set("#scene-close", { autoAlpha: 1 }, 56);
      tl.set("#scene-close", { autoAlpha: 0 }, 60);
      tl.to({}, { duration: 60 }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
